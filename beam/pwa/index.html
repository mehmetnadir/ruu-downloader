<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16130f">
<title>Ruu Beam</title>
<link rel="manifest" href="/app/manifest.webmanifest">
<style>
:root{--bg:#16130f;--surface:#1d1915;--surface2:#272219;--border:#35302a;--text:#ece7de;
--muted:#a89f92;--accent:#e8a33d;--ok:#7fb069;--danger:#d95d4e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,system-ui,sans-serif;
min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:22px 18px;gap:16px}
h1{display:flex;align-items:center;gap:9px;font-size:19px;margin:6px 0 0}
h1 svg{color:var(--accent)}
.card{width:min(440px,100%);background:var(--surface);border:1px solid var(--border);
border-radius:14px;padding:16px}
.muted{color:var(--muted);font-size:13px}
button{font:inherit;font-weight:600;border:none;border-radius:10px;padding:11px 16px;cursor:pointer}
.primary{background:var(--accent);color:#16130f;width:100%}
.ghost{background:transparent;color:var(--muted);border:1px solid var(--border);width:100%}
input{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--border);
border-radius:10px;padding:11px;font:inherit;margin-bottom:10px}
video{width:100%;border-radius:12px;background:#000;aspect-ratio:1;object-fit:cover}
.row{display:flex;gap:8px;margin-top:10px}
.status{padding:10px 12px;border-radius:10px;font-size:13.5px;margin-top:10px}
.status.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.status.err{background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger)}
.hide{display:none}
.paired{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ok)}
</style>
</head>
<body>
<h1>
  <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
       stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 17V3"/><path d="m6 11 6 6 6-6"/><path d="M19 21H5"/></svg>
  Ruu Beam
</h1>
<p class="muted" style="max-width:440px;text-align:center;margin:0">
  Telefonda gördüğün bağlantıyı bilgisayarına gönder — indirme orada başlasın.
</p>

<!-- 1) Eşleştirme -->
<section class="card" id="pair-card">
  <strong>1. Bilgisayarla eşleştir</strong>
  <p class="muted">Ruu panelindeki QR kodu okut ya da eşleştirme metnini yapıştır.</p>
  <video id="cam" class="hide" playsinline muted></video>
  <div class="row">
    <button class="primary" id="scan">QR okut</button>
  </div>
  <div class="row"><input id="manual" placeholder="ruu:… eşleştirme metni"></div>
  <button class="ghost" id="paste">Yapıştırdım, eşleştir</button>
  <div id="pair-status"></div>
</section>

<!-- 2) Gönderme -->
<section class="card hide" id="send-card">
  <strong>2. Bağlantı gönder</strong>
  <p class="muted" id="paired-info"></p>
  <input id="url" type="url" placeholder="https://… indirme bağlantısı" inputmode="url">
  <button class="primary" id="send">Bilgisayara gönder</button>
  <div id="send-status"></div>
  <div class="row"><button class="ghost" id="unpair">Eşleştirmeyi kaldır</button></div>
</section>

<p class="muted" style="text-align:center;max-width:440px">
  Bağlantılar cihazında şifrelenir; aktarım sunucusu içeriği göremez.
</p>

<script type="module" src="/app/app.js"></script>
</body>
</html>
