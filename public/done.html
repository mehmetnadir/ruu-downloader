<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ruu</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: grid; place-items: center; min-height: 100vh; }
  .done-card {
    width: min(420px, 90vw);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 26px;
    text-align: center;
    animation: card-in 320ms var(--ease-out);
  }
  .done-ring {
    width: 58px; height: 58px; margin: 0 auto 16px;
    display: grid; place-items: center;
    border-radius: 50%;
    background: color-mix(in srgb, var(--success) 16%, transparent);
    color: var(--success);
    animation: ring-pop 420ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes ring-pop { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .done-name { font-size: 15px; font-weight: 650; margin: 0 0 4px; word-break: break-all; }
  .done-meta { color: var(--muted); font-size: 12px; margin: 0 0 20px; font-variant-numeric: tabular-nums; }
  .done-actions { display: flex; gap: 8px; justify-content: center; }
  @media (prefers-reduced-motion: reduce) { .done-card, .done-ring { animation: none; } }
</style>
</head>
<body>
<main class="done-card">
  <div class="done-ring" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor"
         stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>
  </div>
  <h1 class="done-name" id="fname">—</h1>
  <p class="done-meta" id="fmeta"></p>
  <div class="done-actions">
    <button id="open" class="btn-accent" data-i18n="openFile"></button>
    <button id="show" class="btn-ghost" data-i18n="showFolder"></button>
  </div>
</main>
<script type="module" src="done.js"></script>
</body>
</html>
